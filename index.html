<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="You Mode" />
    <meta name="theme-color" content="#F2ECDF" />
    <meta name="description" content="You Mode: build a challenge that fits your life. Your checklist, your format, your stakes, your crew." />
    <meta property="og:title" content="You Mode" />
    <meta property="og:description" content="Build a challenge that fits your life. Your checklist, your format, your stakes, your crew." />
    <meta property="og:url" content="https://youmode.app" />
    <meta property="og:image" content="https://youmode.app/logo-1024.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>You Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <script>
      /* Pre-paint theme boot: apply the cached colorway before anything
         renders so light-theme users never see a black flash (and vice
         versa). Keep the bg/brand map in sync with src/theme.js. */
      try {
        var stored = localStorage.getItem('75hard-theme')
        /* Retired colorways remap to the surviving experience (keep in sync
           with THEME_REMAP in src/theme.js). */
        var remap = { espresso: 'navy', sand: 'linen', blush: 'linen' }
        stored = remap[stored] || stored
        var known = ['midnight', 'navy', 'linen'].indexOf(stored) >= 0
        /* No stored theme = brand-new visitor: the first-run journey is cream
           Linen now, so boot paints linen (keep in sync with --lpc-bg/--lpc-sage
           in src/App.jsx THEME). Returning users keep their stored theme. */
        var t = known ? stored : 'linen'
        /* [bg, ink] — ink is the wordmark color that reads on that bg. */
        var m = {
          midnight: ['#08080b', '#EAE6DE'],
          navy: ['#14110D', '#EFE7D8'],
          linen: ['#F2ECDF', '#1E1810'],
        }[t]
        document.documentElement.dataset.theme = t
        document.documentElement.style.background = m[0]
        document.documentElement.style.setProperty('--boot-ink', m[1])
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', m[0])
      } catch (e) { /* default shell below */ }
    </script>
    <style>
      /* Pre-JS shell: kills the wrong-color flash on standalone launch and
         shows a brand mark until React mounts. body stays transparent so the
         boot script's per-theme html background paints the whole canvas. */
      html { background: #F2ECDF; }
      body { margin: 0; }
      #root:empty::after {
        content: 'You Mode';
        display: grid;
        place-items: center;
        height: 100vh;
        font: 700 27px/1 'Playfair Display', Georgia, 'Times New Roman', serif;
        color: var(--boot-ink, #2C2A26);
        letter-spacing: .3px;
        opacity: .9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
