<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B0B0F'/><text x='50' y='42' font-size='34' font-family='Arial Black, sans-serif' font-weight='900' fill='%23FF3B30' text-anchor='middle' dominant-baseline='central'>YOU</text><text x='50' y='70' font-size='20' font-family='Arial Black, sans-serif' font-weight='900' fill='%23FFFFFF' letter-spacing='2' text-anchor='middle' dominant-baseline='central'>MODE</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="You Mode" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="description" content="You Mode — build your own challenge. Daily proof, real stakes, your crew keeping score." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>You Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      /* Pre-paint theme boot: apply the cached colorway before anything
         renders so light-theme users never see a black flash (and vice
         versa). Keep the bg/brand map in sync with src/theme.js. */
      try {
        var t = localStorage.getItem('75hard-theme')
        t = ['midnight', 'espresso', 'navy', 'sand'].indexOf(t) >= 0 ? t : 'midnight'
        var m = {
          midnight: ['#08080b', '#ff3b30'],
          espresso: ['#120D0A', '#ff3b30'],
          navy: ['#070D17', '#ff3b30'],
          sand: ['#EAE0CE', '#A9382A'],
        }[t]
        document.documentElement.dataset.theme = t
        document.documentElement.style.background = m[0]
        document.documentElement.style.setProperty('--boot-brand', m[1])
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', m[0])
      } catch (e) { /* default shell below */ }
    </script>
    <style>
      /* Pre-JS shell: kills the wrong-color flash on standalone launch and
         shows a brand mark until React mounts. */
      html, body { margin: 0; background: #08080b; }
      #root:empty::after {
        content: 'YOU';
        display: grid;
        place-items: center;
        height: 100vh;
        font: 900 56px/1 -apple-system, 'Helvetica Neue', sans-serif;
        color: var(--boot-brand, #ff3b30);
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
